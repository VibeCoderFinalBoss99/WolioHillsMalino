name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 0 */3 * *'   # every 3 days — well under the 7-day window
  workflow_dispatch:         # lets you trigger it manually to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase table
        run: |
          curl -X GET "https://bnghchxebtqqwouyskcs.supabase.co/rest/v1/keep_alive?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
